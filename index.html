<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tile(a, b) 可視化ツール</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Barlow:ital,wght@0,400;0,600;1,400&family=Barlow+Condensed:wght@500;600&display=swap"
    rel="stylesheet"
  />
</head>
<body>
  <div class="app">
    <!-- ─── header ─── -->
    <header class="nav app-header">
      <div class="app-title-group">
        <span class="nav-brand" data-i18n="appTitle">Tile(a, b) 可視化ツール</span>
        <span class="app-subtitle" data-i18n="subtitle">非周期モノタイル連続族</span>
      </div>
      <div class="seg">
        <label class="seg-opt"><input type="radio" name="lang" value="ja" checked /><span>日本語</span></label>
        <label class="seg-opt"><input type="radio" name="lang" value="en" /><span>English</span></label>
      </div>
    </header>

    <div class="app-body">
      <!-- ─── controls ─── -->
      <aside class="controls">
        <section>
          <h6 data-i18n="params">パラメータ</h6>
          <div class="seg" style="width:100%;margin-bottom:var(--space-3);">
            <label class="seg-opt" style="flex:1;justify-content:center;">
              <input type="radio" name="mode" value="ratio" checked /><span data-i18n="modeRatio">比率</span>
            </label>
            <label class="seg-opt" style="flex:1;justify-content:center;">
              <input type="radio" name="mode" value="independent" /><span data-i18n="modeIndep">独立</span>
            </label>
          </div>

          <!-- independent mode -->
          <div id="panel-indep" class="field-row hidden">
            <div class="field">
              <label>a &nbsp;·&nbsp; <span data-i18n="aEdges">A辺 ×8</span></label>
              <input id="a-num" class="input" type="number" min="0" step="0.1" />
              <input id="a-range" type="range" min="0" max="4" step="0.01" aria-label="a" style="margin-top:8px;" />
            </div>
            <div class="field">
              <label>b &nbsp;·&nbsp; <span data-i18n="bEdges">B辺 ×6</span></label>
              <input id="b-num" class="input" type="number" min="0" step="0.1" />
              <input id="b-range" type="range" min="0" max="4" step="0.01" aria-label="b" style="margin-top:8px;" />
            </div>
          </div>

          <!-- ratio mode -->
          <div id="panel-ratio" class="field">
            <label class="field-inline-label">
              <span data-i18n="ratioLabel">比率 b / a</span>
              <span id="ratio-readout" class="readout">1.73</span>
            </label>
            <input id="ratio-range" type="range" min="0" max="4" step="0.01" />
            <div class="ratio-ends"><span>Chevron</span><span>1 : 1</span><span>Comet →</span></div>
          </div>

          <div class="field" style="margin-top:var(--space-3);">
            <label class="field-inline-label">
              <span data-i18n="zoom">表示スケール</span>
              <span id="zoom-readout" class="readout">1.00×</span>
            </label>
            <input id="zoom-range" type="range" min="0.35" max="3" step="0.05" value="1" />
          </div>
        </section>

        <section>
          <h6 data-i18n="presets">プリセット</h6>
          <div id="preset-grid" class="preset-grid"></div>
        </section>

        <section>
          <h6 data-i18n="display">表示</h6>
          <div id="toggle-list"></div>
        </section>
      </aside>

      <!-- ─── canvas ─── -->
      <main class="canvas-main">
        <div class="blueprint canvas-frame">
          <i class="corner tl"></i><i class="corner tr"></i><i class="corner bl"></i><i class="corner br"></i>
          <div id="svg-host" class="svg-host"></div>

          <div class="legend">
            <div class="legend-row">
              <svg width="26" height="0" style="overflow:visible;"><line x1="0" y1="0" x2="26" y2="0" stroke="#5980a6" stroke-width="3" /></svg>
              <span data-i18n="legendA">A辺（長さ a）・8本</span>
            </div>
            <div class="legend-row">
              <svg width="26" height="0" style="overflow:visible;"><line x1="0" y1="0" x2="26" y2="0" stroke="#1d2d3d" stroke-width="3" stroke-dasharray="5 4" /></svg>
              <span data-i18n="legendB">B辺（長さ b）・6本</span>
            </div>
          </div>

          <div id="preset-title" class="preset-title"></div>
          <div id="not-polykite" class="not-polykite hidden" data-i18n="notPolykiteNote"></div>
        </div>
      </main>

      <!-- ─── info ─── -->
      <aside class="info">
        <h6 data-i18n="info">情報</h6>

        <div>
          <div class="info-stat-label">a : b</div>
          <div id="ab-str" class="info-stat-value"></div>
        </div>
        <div>
          <div class="info-stat-label">b / a</div>
          <div id="ratio-str" class="info-stat-value"></div>
        </div>

        <hr class="hr" style="margin:2px 0;" />

        <div class="info-list">
          <div class="info-row"><span class="k" data-i18n="edgeCount">辺数</span><span id="edges-str" class="v"></span></div>
          <div class="info-row"><span class="k" data-i18n="closure">閉路誤差</span><span id="closure-str" class="v"></span></div>
          <div>
            <div class="info-block-label" data-i18n="family">分類</div>
            <span id="family-tag" class="tag"></span>
          </div>
          <div>
            <div class="info-block-label" data-i18n="polykiteLabel">polykite 表示</div>
            <span id="polykite-tag" class="tag"></span>
          </div>
        </div>
      </aside>
    </div>
  </div>

  <script type="module" src="/src/main.ts"></script>
</body>
</html>
